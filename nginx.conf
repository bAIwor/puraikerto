server {
    listen 80;
    listen [::]:80;
    listen 7777;
    listen [::]:7777;

    server_name puraikerto.my.id www.puraikerto.my.id localhost;
    root /home/wijang/www/puraikerto;
    index index.html;

    port_in_redirect off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # static cache — no-cache selama development biar tiap edit langsung kelihatan
    location ~* \.(css|js|svg|png|jpg|ico|woff2?)$ {
        add_header Cache-Control "public, no-cache, must-revalidate";
    }

    location /api/ {
        try_files $uri $uri/ =404;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # PHP handler — must be last so it catches all .php files
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        fastcgi_read_timeout 180;
        fastcgi_send_timeout 180;
        fastcgi_connect_timeout 10;
    }

    # deny access to hidden files
    location ~ /\. {
        deny all;
    }
}
